name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e . coverage
      - name: Run unit tests
        run: coverage run --source=aspect -m unittest discover -s tests -v
      - name: Run end-to-end example with coverage
        env:
          MPLBACKEND: Agg
        run: coverage run --append --source=aspect run_aspect.py
      - name: Verify shell entry point
        env:
          MPLBACKEND: Agg
        run: bash run_all.sh
      - name: Generate coverage report
        run: |
          coverage report -m
          coverage xml
      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
